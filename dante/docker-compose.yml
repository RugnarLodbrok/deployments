services:
  datnte:
    image: davojan/dante-pam
    container_name: dante
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "1080:1080"
    volumes:
      - "./sockd.conf:/etc/sockd.conf:ro"
      - "./sockd.passwd:/etc/danted/sockd.passwd"
    restart: unless-stopped
