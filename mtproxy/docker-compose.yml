services:
  telemt:
    image: ghcr.io/telemt/telemt:3.5.16
    container_name: telemt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "${TELEMT_UID:?Run init-env.sh first}:${TELEMT_GID:?Run init-env.sh first}"
    ports:
      - "${PORT:?Set PORT in .env}:443"
    working_dir: /data
    command: ["/etc/telemt/config.toml"]
    volumes:
      - ./config:/etc/telemt:ro
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/telemt", "healthcheck", "/etc/telemt/config.toml", "--mode", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
