services:
  app:
    image: ${SB_IMAGE:-quay.io/outline/shadowbox:stable}
    container_name: shadowbox
    logging:
      driver: "local"
    network_mode: host
    volumes:
      - ./shadowbox-selfsigned.cert:/opt/outline/persistent-state/shadowbox-selfsigned.cert
      - ./shadowbox-selfsigned.key:/opt/outline/persistent-state/shadowbox-selfsigned.key
    environment:
      SB_API_PORT: 9001
      SB_API_PREFIX: ${SB_API_PREFIX}
      SB_CERTIFICATE_FILE: /opt/outline/persistent-state/shadowbox-selfsigned.cert
      SB_PRIVATE_KEY_FILE: /opt/outline/persistent-state/shadowbox-selfsigned.key
      SB_METRICS_URL: ${SB_METRICS_URL:-}
