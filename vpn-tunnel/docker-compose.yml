services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      NGINX_ENVSUBST_FILTER: '^VPN_'
      VPN_LISTEN_ADDRESS: "${VPN_LISTEN_ADDRESS:-0.0.0.0}"
      VPN_LISTEN_PORT: "${VPN_LISTEN_PORT:-443}"
      VPN_UPSTREAM_HOST: "${VPN_UPSTREAM_HOST:?Set VPN_UPSTREAM_HOST in .env}"
      VPN_UPSTREAM_PORT: "${VPN_UPSTREAM_PORT:-443}"
      VPN_CONNECT_TIMEOUT: "${VPN_CONNECT_TIMEOUT:-5s}"
      VPN_IDLE_TIMEOUT: "${VPN_IDLE_TIMEOUT:-10m}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./relay.conf.stream-template:/etc/nginx/templates/relay.conf.stream-template:ro
    logging:
      driver: local
