services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:v3.11.0
    container_name: 3x-ui
    restart: unless-stopped
    network_mode: host
    environment:
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_PORT: "2053"
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
      - ./acme:/root/.acme.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
