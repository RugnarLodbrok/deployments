services:
  3x-ui:
    build: .
    image: local/3x-ui-https:3.11.0-acme3.1.6
    container_name: 3x-ui
    restart: unless-stopped
    network_mode: host
    environment:
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_PORT: "2053"
      ACME_IP: "${ACME_IP:?Copy .env.example to .env and set ACME_IP}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
      - ./acme:/root/.acme.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
